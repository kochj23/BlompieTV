name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: macos-15

    steps:
    - uses: actions/checkout@v4

    - name: Environment
      run: |
        xcodebuild -version
        echo "Available Apple TV simulators:"
        xcrun simctl list devices available | grep -i "Apple TV" || true

    - name: Test (tvOS Simulator)
      run: |
        set -o pipefail

        XCODEPROJ=$(find . -name "*.xcodeproj" -maxdepth 2 | head -1)
        echo "Project: $XCODEPROJ"

        xcodebuild test \
          -project "$XCODEPROJ" \
          -scheme BlompieTV \
          -destination 'platform=tvOS Simulator,name=Apple TV' \
          CODE_SIGNING_ALLOWED=NO \
          SWIFT_TREAT_WARNINGS_AS_ERRORS=NO
